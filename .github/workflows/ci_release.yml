name: CI/CD Test, Build, & Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-and-release:
    name: Test, Build, and Auto-Release
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Generate Dummy Data & Run Automated Tests
        env:
          CI: "true"
        run: |
          python scripts/generate_sample_data.py
          python -m pytest tests/test_mailmerge.py -v

      - name: Extract Version and Generate Release Notes
        id: meta
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.config.version import (
              __version__,
              __author__,
              __repository__,
              FEATURE_REGISTRY,
          )

          zip_name = f"VoterMail_Engine_v{__version__}_Windows_x64_Portable.zip"
          zip_path = f"dist/{zip_name}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={__version__}\n")
              f.write(f"tag=v{__version__}\n")
              f.write(f"zip_name={zip_name}\n")
              f.write(f"zip_path={zip_path}\n")

          notes = [
              f"## VoterMail Engine v{__version__} — Portable Windows Edition (.EXE)",
              f"**Developed by:** {__author__} ([Repository]({__repository__}))\n",
              "### Cara Penggunaan (Tanpa Instalasi Python):",
              "1. Unduh file **`.zip`** pada bagian **Assets** di bawah.",
              "2. Ekstrak folder ke komputer Anda.",
              "3. Letakkan file Word Surat Panggilan dan Excel DPT di dalam folder `data/templates/`.",
              "4. Klik 2x **`VoterMail_Engine.exe`** untuk langsung menjalankan aplikasi.\n",
              "### Riwayat Pembaruan Fitur (Changelog):"
          ]
          for item in FEATURE_REGISTRY:
              ver = item.get("version", "")
              desc = item.get("description", item.get("title", ""))
              notes.append(f"- **v{ver}**: {desc}")

          Path("RELEASE_NOTES.md").write_text("\n".join(notes), encoding="utf-8")
          print(f"Prepared metadata for v{__version__} -> {zip_path}")

      - name: Build Portable Windows EXE Package (--onedir)
        run: |
          python scripts/build_exe.py

      - name: Upload Build Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 30

      - name: Publish Portable EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "VoterMail Engine ${{ steps.meta.outputs.tag }} (Windows x64 Portable .EXE)"
          body_path: RELEASE_NOTES.md
          files: ${{ steps.meta.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
