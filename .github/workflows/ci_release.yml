# VoterMail Engine — High-Volume Word & Excel DPT Mail-Merge Automation
# Created by Danang Satria (https://github.com/Smurffahh/votermail-engine)

name: CI/CD Test, Build, & Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-and-release:
    name: Test, Build, and Auto-Release
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Generate Dummy Data & Run Automated Tests
        env:
          CI: "true"
        run: |
          python scripts/generate_sample_data.py
          python -m pytest tests/test_mailmerge.py -v

      - name: Extract Version and Generate Release Notes
        id: meta
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from app.config.version import (
              __version__,
              __author__,
              __repository__,
              FEATURE_REGISTRY,
              parse_version_tuple,
              validate_version_registry,
          )

          validate_version_registry()
          curr_tuple = parse_version_tuple(__version__)

          try:
              tag_out = subprocess.check_output(["git", "tag", "--list", "v*"], text=True)
              existing_tags = [t.strip().lstrip("v") for t in tag_out.splitlines() if t.strip()]
          except Exception as exc:
              print(f"Catatan: Gagal memuat daftar git tag: {exc}")
              existing_tags = []

          highest_tag_tuple = (0, 0, 0)
          highest_tag_str = ""
          for t_str in existing_tags:
              t_tuple = parse_version_tuple(t_str)
              if t_tuple > highest_tag_tuple:
                  highest_tag_tuple = t_tuple
                  highest_tag_str = t_str

          if highest_tag_tuple > (0, 0, 0) and curr_tuple < highest_tag_tuple:
              print(
                  f"FATAL: Regresi rilis terdeteksi! Versi aktif v{__version__} lebih kecil dari tag git tertinggi v{highest_tag_str}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          zip_name = f"VoterMail_Engine_v{__version__}_Windows_x64_Portable.zip"
          zip_path = f"dist/{zip_name}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={__version__}\n")
              f.write(f"tag=v{__version__}\n")
              f.write(f"zip_name={zip_name}\n")
              f.write(f"zip_path={zip_path}\n")

          latest_entry = FEATURE_REGISTRY[-1]
          ver = latest_entry.get("version", __version__)
          desc = latest_entry.get("description", latest_entry.get("title", ""))
          highlights = latest_entry.get("highlights", [])

          notes = [
              f"## VoterMail Engine v{ver} — Portable Windows Edition (.EXE)",
              f"**Dikembangkan oleh:** {__author__} ([Repositori Resmi]({__repository__}))\n",
              f"### Apa yang Baru di Versi v{ver}:",
          ]
          if highlights:
              for item in highlights:
                  notes.append(f"- {item}")
          else:
              for part in [p.strip() for p in desc.split(",") if p.strip()]:
                  notes.append(f"- {part[0].upper() + part[1:]}")

          notes.extend([
              "\n### Cara Penggunaan Baru / Update Manual:",
              "1. Unduh file **`.zip`** pada bagian **Assets** di bawah (atau gunakan fitur **Update Otomatis** langsung dari dalam aplikasi).",
              "2. Ekstrak folder ke komputer Anda.",
              "3. Letakkan file Word Surat Panggilan dan Excel DPT di dalam folder `data/templates/`.",
              "4. Klik 2x **`VoterMail_Engine.exe`** untuk menjalankan aplikasi."
          ])

          Path("RELEASE_NOTES.md").write_text("\n".join(notes), encoding="utf-8")
          print(f"Prepared metadata for v{__version__} -> {zip_path}")

      - name: Build Portable Windows EXE Package (--onedir)
        run: |
          python scripts/build_exe.py

      - name: Upload Build Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 30

      - name: Publish Portable EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "VoterMail Engine ${{ steps.meta.outputs.tag }} (Windows x64 Portable .EXE)"
          body_path: RELEASE_NOTES.md
          files: ${{ steps.meta.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
